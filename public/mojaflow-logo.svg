    <path d="M 242 189 C 242 178 246 172 253 166 C 263 158 272 152 272 138 C 272 125 262 116 249 116 C 236 116 226 123 224 135 L 208 131 C 212 112 227 101 249 101 C 272 101 289 115 289 137 C 289 155 277 165 266 173 C 259 178 257 182 257 189 L 242 189 Z" />
