  <!-- Bottom Brand Text: GLOBAL SOLUTIONS CO. -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" fill="#000000" text-anchor="middle">
