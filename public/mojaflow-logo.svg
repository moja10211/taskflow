  <!-- Top Curved Brand Text: MOJA -->
  <defs>
    <path id="moja-arc" d="M 120 128 A 170 170 0 0 1 380 128" fill="none" />
    <path id="global-arc" d="M 130 422 A 175 175 0 0 0 370 422" fill="none" />
  </defs>

  <text font-family="'Arial Black', 'Impact', -apple-system, sans-serif" font-weight="900" font-size="58" letter-spacing="4" fill="#000000">
